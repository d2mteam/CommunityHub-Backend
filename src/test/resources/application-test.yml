spring:
  data:
    redis:
      timeout: PT2S
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins:
      - http://localhost:5173
  security:
    jwt:
      issuer: communityhub-test
      secret: test-secret-test-secret-test-secret-test-secret
      access-token-ttl: PT15M
      refresh-token-ttl: P30D
  oauth:
    frontend-callback-uri: http://localhost:5173/auth/oauth/callback
    state-ttl: PT5M
    ticket-ttl: PT2M
    providers:
      google:
        enabled: false
        issuer-uri: http://localhost:9201
        client-id: communityhub-web
        client-secret: dev-secret
        redirect-uri: http://localhost:8080/api/auth/oauth/google/callback
      facebook:
        enabled: false
        issuer-uri: http://localhost:9202
        client-id: communityhub-web
        client-secret: dev-secret
        redirect-uri: http://localhost:8080/api/auth/oauth/facebook/callback
  media:
    bucket: communityhub-test
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    region: us-east-1
    path-style-access-enabled: true
    upload-url-ttl: PT10M
    read-url-ttl: PT10M
    reservation-ttl: PT15M
    orphan-retention: PT24H
    max-file-size-bytes: 5242880
    allowed-mime-types:
      - image/jpeg
      - image/png
  content:
    posts:
      max-attachments: 8
      default-page-size: 10
      max-page-size: 30
    comments:
      max-attachments: 8
      default-page-size: 10
      max-page-size: 30
  ids:
    worker-id: 1
