spring:
  application:
    name: CommunityHub-Backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/communityhub}
    username: ${DB_USERNAME:communityhub}
    password: ${DB_PASSWORD:communityhub}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:PT2S}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    jwt:
      issuer: ${JWT_ISSUER:communityhub-backend}
      secret: ${JWT_SECRET:development-secret-change-me-development-secret-change-me}
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
  oauth:
    frontend-callback-uri: ${OAUTH_FRONTEND_CALLBACK_URI:http://localhost:5173/auth/oauth/callback}
    state-ttl: ${OAUTH_STATE_TTL:PT5M}
    ticket-ttl: ${OAUTH_TICKET_TTL:PT2M}
    providers:
      google:
        enabled: ${OAUTH_GOOGLE_ENABLED:false}
        issuer-uri: ${OAUTH_GOOGLE_ISSUER_URI:http://localhost:9201}
        client-id: ${OAUTH_GOOGLE_CLIENT_ID:communityhub-web}
        client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:dev-secret}
        redirect-uri: ${OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth/google/callback}
      facebook:
        enabled: ${OAUTH_FACEBOOK_ENABLED:false}
        issuer-uri: ${OAUTH_FACEBOOK_ISSUER_URI:http://localhost:9202}
        client-id: ${OAUTH_FACEBOOK_CLIENT_ID:communityhub-web}
        client-secret: ${OAUTH_FACEBOOK_CLIENT_SECRET:dev-secret}
        redirect-uri: ${OAUTH_FACEBOOK_REDIRECT_URI:http://localhost:8080/api/auth/oauth/facebook/callback}
  media:
    bucket: ${MEDIA_BUCKET:communityhub-public}
    endpoint: ${MEDIA_ENDPOINT:http://localhost:9100}
    access-key: ${MEDIA_ACCESS_KEY:minioadmin}
    secret-key: ${MEDIA_SECRET_KEY:minioadmin}
    region: ${MEDIA_REGION:us-east-1}
    path-style-access-enabled: ${MEDIA_PATH_STYLE:true}
    upload-url-ttl: ${MEDIA_UPLOAD_URL_TTL:PT10M}
    read-url-ttl: ${MEDIA_READ_URL_TTL:PT10M}
    reservation-ttl: ${MEDIA_RESERVATION_TTL:PT15M}
    orphan-retention: ${MEDIA_ORPHAN_RETENTION:PT24H}
    max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:5242880}
    allowed-mime-types:
      - image/jpeg
      - image/png
  content:
    posts:
      max-attachments: ${CONTENT_POST_MAX_ATTACHMENTS:8}
      default-page-size: ${CONTENT_POST_DEFAULT_PAGE_SIZE:10}
      max-page-size: ${CONTENT_POST_MAX_PAGE_SIZE:30}
    comments:
      max-attachments: ${CONTENT_COMMENT_MAX_ATTACHMENTS:8}
      default-page-size: ${CONTENT_COMMENT_DEFAULT_PAGE_SIZE:10}
      max-page-size: ${CONTENT_COMMENT_MAX_PAGE_SIZE:30}
  ids:
    worker-id: ${ID_WORKER_ID:1}
